<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrostByte Chat — Multiplayer Template</title>
<meta name="description" content="Minimal multiplayer chat room powered by FrostByte play.js — the hello-world of P2P networking.">
<meta name="theme-color" content="#05070f">
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;❄&lt;/text&gt;&lt;/svg&gt;">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!--
  ═══════════════════════════════════════════════════════════════
  FROSTBYTE CHAT — the "hello world" of P2P networking.
  Quick match or room codes, live roster, broadcast messages.
  Open in two tabs → Quick Match in both → talk to yourself. 🎉
  ═══════════════════════════════════════════════════════════════
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #0e1830 0%, #05070f 60%);
    color:#e8f6ff; font-family:'Space Grotesk', system-ui, sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header { display:flex; align-items:center; gap:14px; padding:16px 24px; max-width:860px; margin:0 auto; width:100%; }
  .logo { font-weight:700; font-size:18px; } .logo b { color:#22d3ee; }
  header a { color:#8aa2c0; text-decoration:none; font-size:14px; margin-left:auto; }
  header a:hover { color:#22d3ee; }
  #app { width:min(92vw, 860px); margin:6px auto 30px; flex:1; display:flex; gap:14px; min-height:0; }
  #side {
    width:210px; flex-shrink:0; border:1px solid rgba(125,211,252,.22); border-radius:16px;
    background:rgba(13,20,38,.6); padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  #side h3 { font-size:12px; letter-spacing:1.5px; color:#8aa2c0; font-family:'JetBrains Mono',monospace; }
  .player { font-size:13.5px; padding:7px 10px; border-radius:9px; background:rgba(34,211,238,.07); border:1px solid rgba(125,211,252,.18); }
  .player.host { border-color:rgba(34,211,238,.5); }
  .player small { color:#8aa2c0; display:block; font-size:10.5px; font-family:'JetBrains Mono',monospace; }
  #main { flex:1; display:flex; flex-direction:column; border:1px solid rgba(125,211,252,.22); border-radius:16px; background:rgba(13,20,38,.6); overflow:hidden; min-height:0; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .msg { max-width:75%; padding:9px 14px; border-radius:14px; font-size:14.5px; line-height:1.45; }
  .msg .who { font-size:11px; font-family:'JetBrains Mono',monospace; color:#7dd3fc; display:block; margin-bottom:2px; }
  .msg.them { align-self:flex-start; background:rgba(125,211,252,.10); border:1px solid rgba(125,211,252,.22); border-bottom-left-radius:4px; }
  .msg.me   { align-self:flex-end;  background:rgba(139,92,246,.14); border:1px solid rgba(139,92,246,.35); border-bottom-right-radius:4px; }
  .msg.sys  { align-self:center; background:none; border:none; color:#5b7391; font-size:12px; font-family:'JetBrains Mono',monospace; }
  form { display:flex; gap:8px; padding:14px; border-top:1px solid rgba(125,211,252,.16); background:rgba(2,6,17,.4); }
  form input {
    flex:1; padding:12px 16px; border-radius:11px; border:1px solid rgba(125,211,252,.3);
    background:rgba(2,6,17,.6); color:#e8f6ff; font-family:inherit; font-size:14.5px; outline:none;
  }
  form input:focus { border-color:#22d3ee; box-shadow:0 0 14px rgba(34,211,238,.25); }
  form button {
    padding:12px 22px; border-radius:11px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#22d3ee,#3b82f6); color:#04121a; font-weight:700; font-family:inherit;
  }
  form button:hover { box-shadow:0 4px 20px rgba(34,211,238,.4); }
  /* gate */
  #gate { position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:rgba(4,7,15,.9); backdrop-filter:blur(8px); }
  #gate.hidden { display:none; }
  .panel { width:min(88%, 420px); text-align:center; background:rgba(13,20,38,.75); border:1px solid rgba(125,211,252,.25); border-radius:18px; padding:34px 30px; }
  .panel h1 { font-size:26px; margin-bottom:6px; background:linear-gradient(90deg,#22d3ee,#a78bfa); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .panel .sub { color:#8aa2c0; font-size:13.5px; margin-bottom:22px; }
  .panel input {
    width:100%; padding:12px 16px; border-radius:11px; border:1px solid rgba(125,211,252,.3);
    background:rgba(2,6,17,.6); color:#e8f6ff; font-family:inherit; font-size:15px; outline:none; text-align:center; margin-bottom:10px;
  }
  .btn { display:block; width:100%; margin:10px 0; padding:13px; border-radius:12px; border:1px solid rgba(125,211,252,.35); background:rgba(34,211,238,.08); color:#e8f6ff; font-weight:600; font-size:15px; cursor:pointer; font-family:inherit; }
  .btn:hover { background:rgba(34,211,238,.18); }
  .btn.primary { background:linear-gradient(135deg,#22d3ee,#3b82f6); color:#04121a; border-color:transparent; }
  .row { display:flex; gap:8px; }
  .row input.code { letter-spacing:4px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; }
  #status { min-height:20px; margin-top:12px; color:#7dd3fc; font-family:'JetBrains Mono',monospace; font-size:12.5px; }
  @media (max-width:640px){ #side { display:none; } }
</style>
</head>
<body>

<header>
  <span class="logo">❄ Frost<b>Byte</b> · CHAT</span>
  <a href="../index.html">← home</a>
</header>

<div id="app">
  <div id="side"><h3>PLAYERS</h3><div id="players"></div></div>
  <div id="main">
    <div id="log"></div>
    <form id="f"><input id="inp" placeholder="type a message…" autocomplete="off" maxlength="200"><button>Send</button></form>
  </div>
</div>

<div id="gate">
  <div class="panel">
    <h1>❄ FROSTBYTE CHAT</h1>
    <p class="sub">the hello-world of peer-to-peer networking</p>
    <input id="name" placeholder="your nickname" maxlength="12" autocomplete="off">
    <button class="btn primary" id="bQuick">⚡ Quick Match</button>
    <div class="row">
      <input id="code" class="code" maxlength="4" placeholder="CODE">
      <button class="btn" id="bJoin" style="width:auto;padding:12px 20px">Join</button>
    </div>
    <button class="btn" id="bHost">🏠 Create Room</button>
    <div id="status"></div>
  </div>
</div>

<script src="../play.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let game = null, me = null;

function log(text, who, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (who) { const w = document.createElement('span'); w.className = 'who'; w.textContent = who; d.appendChild(w); }
  d.appendChild(document.createTextNode(text));
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollTopMax || 1e9;
  $('log').scrollTop = 1e9;
}

function renderPlayers() {
  $('players').innerHTML = '';
  (game ? game.players() : []).forEach(p => {
    const el = document.createElement('div');
    el.className = 'player' + (p.isHost ? ' host' : '');
    el.innerHTML = p.isHost ? (p.name || 'Host') + ' 👑<small>host</small>'
                            : (p.name || 'Player') + '<small>guest</small>';
    $('players').appendChild(el);
  });
}

function connect(mode, code) {
  const name = $('name').value.trim() || 'anon';
  game = new Play({
    game: 'frostbyte-chat',
    playerName: name,
    onStatus: (s, detail) => $('status').textContent = detail,
    onReady: () => {
      me = game.me;
      $('gate').classList.add('hidden');
      log('connected — say hi!', '', 'sys');
      renderPlayers();
    },
    onPlayerJoin: p => { log((p.name || 'someone') + ' joined the room', '', 'sys'); renderPlayers(); },
    onPlayerLeave: p => { log((p.name || 'someone') + ' left', '', 'sys'); renderPlayers(); },
    onData: (d, from) => {
      if (d.t === 'msg') log(d.text, (from.isHost ? '👑 ' : '') + (d.name || from.id.slice(0, 8)), from.id === (me && me.id) ? 'me' : 'them');
    },
    onError: err => { $('status').textContent = err.message; }
  });

  if (mode === 'quick') game.quickMatch().catch(e => $('status').textContent = e.message);
  if (mode === 'host')  game.host().catch(e => $('status').textContent = e.message);
  if (mode === 'join')  game.join(code).catch(e => $('status').textContent = e.message);
}

$('bQuick').onclick = () => connect('quick');
$('bHost').onclick  = () => connect('host');
$('bJoin').onclick  = () => { const c = $('code').value.trim().toUpperCase(); if (c) connect('join', c); };

$('f').onsubmit = e => {
  e.preventDefault();
  const text = $('inp').value.trim();
  if (!text || !game) return;
  game.broadcast({ t: 'msg', text, name: (me && me.name) || 'anon' });
  log(text, 'you', 'me');
  $('inp').value = '';
};

log('pick a nickname and connect ❄', '', 'sys');
</script>
</body>
</html>
